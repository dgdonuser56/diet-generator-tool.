            <div class="flex justify-center gap-6 mb-12">

    <script>

        // 10 Strategic Diet Plans

            {n: "Elite Lean Shred", cal: 1800, p: 170, c: 120, f: 55, m: ["6 Egg Whites, Spinach", "150g Fish, Green Salad", "1 Scoop Whey, 10 Almonds", "150g Chicken Breast, Broccoli", "1 Apple, Black Coffee", "Fiber Shake"]},
            {n: "Cyber Keto Burn", cal: 1600, p: 130, c: 25, f: 115, m: ["3 Eggs in Butter, Avocado", "150g Paneer, Olive Oil", "30g Walnuts", "150g Salmon, Asparagus", "Bulletproof Coffee", "20g Cheese"]},
            {n: "PCOS Wellness", cal: 1750, p: 100, c: 160, f: 65, m: ["Chia Pudding, Almond Milk", "150g Dal, 1 Roti, Veggies", "Flax Seeds, Berries", "150g Fish, Salad", "Green Tea, Walnuts", "Greek Yogurt"]},
            {n: "Plant-Based Hypertrophy", cal: 2400, p: 140, c: 320, f: 60, m: ["Soya Flakes, Soy Milk", "150g Tofu, 150g Brown Rice", "Plant Protein, Banana", "Chickpea Salad (100g)", "Roasted Chana (50g)", "Lentil Soup"]},
            {n: "Glycemic Index Control", cal: 1800, p: 110, c: 190, f: 55, m: ["Steel Cut Oats, Cinnamon", "100g Boiled Chickpeas", "200g Green Veg, 100g Fish", "Hummus, Cucumber", "Multigrain Roti, Dal", "Soaked Almonds"]},
            {n: "Hypertrophy Power", cal: 3000, p: 200, c: 380, f: 80, m: ["4 Whole Eggs, 100g Oats", "200g Rice, 150g Steak", "Banana, Whey, PB", "200g Rice, 150g Chicken", "100g Pasta, Turkey", "Casein Shake"]},
            {n: "Intermittent Shred", cal: 1900, p: 160, c: 150, f: 60, m: ["(1PM) 4 Eggs, 50g Oats", "(3PM) Fruit, 10 Almonds", "(5PM) 150g Chicken, Rice", "(7PM) Whey Protein", "(9PM) 150g Fish, Veggies", "Fast till 1PM"]},
            {n: "Hybrid Endurance", cal: 2600, p: 130, c: 410, f: 65, m: ["Oat Pancakes, Honey", "200g Rice, 1 Potato", "Energy Gel, Banana", "150g Pasta, Chicken", "80g Rice, 100g Fish", "Electrolytes"]},

        ];

        function init() {
            const qBox = document.getElementById('qualificationsList');
            certIds.forEach((id, i) => {
                qBox.innerHTML += `
                    <div onclick="window.open('https://drive.google.com/file/d/${id}/view')" class="p-5 glass-panel flex items-center gap-4 active:bg-[#ff003c]/20 transition-all border border-white/5 mb-2">
                        <i class="fas fa-file-shield text-[#ff003c]"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Verification 0${i+1}</span>
                    </div>`;
            });

            const dGrid = document.getElementById('dietContainer');
            diets.forEach((p, i) => {
                dGrid.innerHTML += `
                    <div class="glass-panel p-6 flex justify-between items-center active:scale-95 transition-all red-glow-box">
                        <div>
                            <p class="text-[8px] text-[#ff003c] font-black uppercase tracking-[2px]">System Plan 0${i+1}</p>
                            <h4 class="font-black text-xs uppercase text-white/90">${p.n}</h4>
                        </div>
                        <button onclick="viewDiet(${i})" class="bg-white/5 border border-white/10 px-6 py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest text-[#ff003c]">Analyze</button>
                    </div>`;
            });
        }

        function viewDiet(i) {
            const d = diets[i];
            document.getElementById('modalTitle').innerText = d.n;
            document.getElementById('modalStats').innerHTML = `
                <div class="glass-panel p-5 text-center border-white/10"><p class="text-[8px] opacity-40 uppercase mb-1">Calories</p><p class="text-xs font-black text-white">${d.cal}</p></div>
                <div class="glass-panel p-5 text-center border-white/10"><p class="text-[8px] opacity-40 uppercase mb-1">Protein</p><p class="text-xs font-black text-[#ff003c]">${d.p}g</p></div>
                <div class="glass-panel p-5 text-center border-white/10"><p class="text-[8px] opacity-40 uppercase mb-1">Carbs</p><p class="text-xs font-black text-pink-400">${d.c}g</p></div>`;
            let h = "";
            d.m.forEach((meal, idx) => {
                h += `<div class="glass-panel p-6 border-l-4 border-[#ff003c] shadow-lg"><p class="text-[9px] text-gray-500 font-black uppercase mb-2">Meal Phase 0${idx+1}</p><p class="text-sm font-bold opacity-90">${meal}</p></div>`;
            });
            document.getElementById('modalMeals').innerHTML = h;
            document.getElementById('planModal').style.display = "block";
            document.body.style.overflow = "hidden";
        }

        function executeSearch() {
            const q = document.getElementById('webSearch').value;
            if(!q) return;
            const url = q.toLowerCase().includes('youtube') ? `https://www.youtube.com/results?search_query=${q}` : `https://www.google.com/search?q=${q}`;
            window.open(url, '_blank');
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('active'); 
            document.getElementById('overlay').classList.toggle('hidden'); 
        }
        function closeModal() { 
            document.getElementById('planModal').style.display = "none"; 
            document.body.style.overflow = "auto";
        }
        function shareApp() { 
            if (navigator.share) navigator.share({ title: 'Syed Akki Elite Fitness', url: window.location.href }); 
        }
        
        init();
    </script>
</body>
</html>
